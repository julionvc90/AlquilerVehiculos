spring:
  application:
    name: disponibilidad
  datasource:
    url: jdbc:mysql://localhost:3306/disponibilidad_db?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 9095

springdoc:
  api-docs:
    enabled: true
    path: /api/disponibilidad/v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/disponibilidad_db?createDatabaseIfNotExist=true
  jpa:
    hibernate:
      ddl-auto: create
