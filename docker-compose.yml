  gateway:
    build: ./gateway
    container_name: gateway-ms
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - usuario
      - cliente
      - vendedor
      - vehiculo
      - disponibilidad
      - inspeccion
      - alquiler
      - pago
      - reserva
      - multa

volumes:
  mysql-data:
