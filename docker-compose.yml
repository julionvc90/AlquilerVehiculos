      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://proyectovehiculos-mysql:3306/disponibilidad_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  inspeccion:
    build: ./inspeccion
    container_name: inspeccion-ms
    ports:
      - "9096:9096"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://proyectovehiculos-mysql:3306/inspeccion_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  alquiler:
    build: ./alquiler
    container_name: alquiler-ms
    ports:
      - "9097:9097"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://proyectovehiculos-mysql:3306/alquiler_db?createDatabaseIfNotExist=true
