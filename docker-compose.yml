      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  disponibilidad:
    build: ./disponibilidad
    container_name: disponibilidad-ms
